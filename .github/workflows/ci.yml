name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Official texts gate
        run: node pipeline/verify-texts.mjs
      - name: Package contents check
        run: npm pack --dry-run
